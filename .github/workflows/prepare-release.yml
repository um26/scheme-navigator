name: Prepare translated release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheme-navigator-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a non-main release branch
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "::error::Run this workflow from a work/release branch. Vercel deploys main only."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require Hugging Face token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Add repository secret HF_TOKEN once (Hugging Face READ token with IndicTrans2 access)."
            exit 1
          fi

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-indictrans2-dist-200m-v1

      - name: Restore incremental translation cache
        uses: actions/cache@v4
        with:
          path: .translation-work/cache
          key: ui-translation-${{ github.ref_name }}-${{ hashFiles('lib/i18n/locales/en.js', 'lib/i18n/extras.js', 'lib/i18n/conditionMessages.js', 'lib/i18n/releaseMessages.js') }}
          restore-keys: |
            ui-translation-${{ github.ref_name }}-
            ui-translation-

      - name: Install translator
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.51,<5' sentencepiece sacremoses indictranstoolkit

      - name: Audit newly-added UI copy
        env:
          I18N_BASE_REF: origin/main
        run: node scripts/lint-i18n-ui.mjs

      - name: Translate only missing or changed UI strings
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
          TOKENIZERS_PARALLELISM: "false"
        run: npm run i18n:translate-ui

      - name: Verify every selectable language
        run: npm run i18n:check

      - name: Install app dependencies
        run: npm install --ignore-scripts

      - name: Full production build check
        run: npm run release:check

      - name: Commit generated translation delta
        shell: bash
        run: |
          git config user.name "Scheme Navigator Translation Bot"
          git config user.email "scheme-navigator@users.noreply.github.com"
          git add lib/i18n/generated.js public/i18n/generated-ui.json public/i18n/ui-manifest.json
          if git diff --cached --quiet; then
            echo "Translations already current."
          else
            git commit -m "Refresh incremental UI translations"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Release status
        run: node scripts/i18n-status.mjs
