name: Prepare translated release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/i18n/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/prepare-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheme-navigator-release-main
  cancel-in-progress: true

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch production i18n baseline
        shell: bash
        run: git fetch origin i18n/production-baseline:refs/remotes/origin/i18n/production-baseline || true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache translation model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-indictrans2-public-dist-200m-v2

      - name: Restore incremental translation cache
        uses: actions/cache@v4
        with:
          path: .translation-work/cache
          key: ui-translation-main-${{ hashFiles('lib/i18n/locales/en.js', 'lib/i18n/extras.js', 'lib/i18n/conditionMessages.js', 'lib/i18n/releaseMessages.js') }}
          restore-keys: |
            ui-translation-main-
            ui-translation-

      - name: Install translator
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.51,<5' sentencepiece sacremoses indictranstoolkit

      - name: Audit all UI copy since last production release
        env:
          I18N_BASE_REF: origin/i18n/production-baseline
        run: node scripts/lint-i18n-ui.mjs

      - name: Select complete zero-secret IndicTrans2 mirror for this authoring run
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/translate-catalog.py')
          text = p.read_text(encoding='utf-8')
          official = 'MODEL_NAME = "ai4bharat/indictrans2-en-indic-dist-200M"'
          public = 'MODEL_NAME = "naklitechie/indictrans2-en-indic-dist-200M"'
          if official not in text:
              raise SystemExit('Expected IndicTrans2 model declaration was not found')
          p.write_text(text.replace(official, public, 1), encoding='utf-8')
          PY

      - name: Translate only missing or changed UI strings
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: npm run i18n:translate-ui

      - name: Restore canonical authoring script
        if: always()
        run: git checkout -- scripts/translate-catalog.py

      - name: Verify every selectable language
        env:
          I18N_BASE_REF: origin/i18n/production-baseline
        run: npm run i18n:check

      - name: Install app dependencies
        run: npm install --ignore-scripts

      - name: Full production build check
        env:
          I18N_BASE_REF: origin/i18n/production-baseline
        run: npm run release:check

      - name: Commit generated translation delta to main
        shell: bash
        run: |
          git config user.name "Scheme Navigator Translation Bot"
          git config user.email "scheme-navigator@users.noreply.github.com"
          git add lib/i18n/generated.js public/i18n/generated-ui.json public/i18n/ui-manifest.json
          if git diff --cached --quiet; then
            echo "Translations already current."
          else
            git commit -m "Refresh incremental UI translations"
            git push origin HEAD:main
          fi

      - name: Release status
        run: node scripts/i18n-status.mjs
