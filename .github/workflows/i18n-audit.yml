name: i18n release gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch production i18n baseline
        shell: bash
        run: git fetch origin i18n/production-baseline:refs/remotes/origin/i18n/production-baseline || true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Export current UI source
        run: node scripts/export-ui-source.mjs

      - name: Check new hard-coded UI copy
        env:
          I18N_BASE_REF: origin/i18n/production-baseline
        run: node scripts/lint-i18n-ui.mjs

      - name: Check 22-language coverage and freshness
        run: node scripts/check-i18n-coverage.mjs
